[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "v2hub-cli"
version = "1.1.2"
description = "Command-line interface for V2Hub VPN Subscription API client"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "nestt", email = "nestt@tutamail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Environment :: Console",
]
keywords = ["vpn", "api", "cli", "client", "subscription", "terminal"]

dependencies = [
    "v2hub>=1.1.1,<2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "build>=1.4.4",
    "v2hub-admin>=1.1.2",
]

[project.optional-dependencies]
admin = [
    "v2hub-admin>=1.1.2,<2.0.0",
]
dev = [
    "v2hub-admin>=1.1.2,<2.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
    "respx>=0.23.1",
]

[project.scripts]
v2hub = "v2hub_cli.cli:main"

[project.urls]
Homepage = "https://github.com/nestthub/v2hub-cli"
Documentation = "https://github.com/nestthub/v2hub-cli#readme"
Repository = "https://github.com/nestthub/v2hub-cli"
Issues = "https://github.com/nestthub/v2hub-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/v2hub_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]


[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF",
]

ignore = ["E501", "B008", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["v2hub", "v2hub_admin", "v2hub_cli"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["v2hub_cli"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]
